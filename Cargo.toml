# LuaJIT is Lua 5.1-source-compatible but uses its own bytecode format.
# Project tools convert legacy `.luac` files into editable `.lua`; Azoth
# compiles those `.lua` sources into VM-specific bytecode products.
#
# These deps are intentionally backend-AGNOSTIC (no `lua54`/`luajit`/... here).
# `mlua-sys` requires exactly one Lua backend per build graph, so the choice is
# owned in ONE place: `az-framework` (the engine scripting host) selects it via
# its own `default = ["luajit"]` feature. Every other crate — engine gems and
# separate project workspaces alike — depends on `bevy_mod_scripting` without a
# backend and inherits the framework's choice, which makes a backend mismatch
# (the classic `enable only one of the features` build break) structurally
# impossible. Audit with `cargo tree -e features -i mlua-sys`.
bevy_mod_scripting = { version = "0.19", default-features = false }
bevy_mod_scripting_lua = { version = "0.19", default-features = false }
bevy_reflect = "0.19"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
bevy_tasks = "0.19"
bevy-steamworks = "0.16"
bindgen = "0.72"
bitflags = "2"
blake3 = "1"
bracket-noise = "0.8.7"
bumpalo = { version = "3.20", features = ["collections"] }
bytemuck = { version = "1.20", features = ["derive"] }
bytes = "1.11"
capnp = "0.26"
capnp-rpc = "0.26"
capnpc = "0.26"
cc = "1"
chrono = "0.4"
ciborium = "0.2"
clap = { version = "4.6", features = ["env"] }
crc32fast = "1.4"
criterion = { version = "0.8", features = ["html_reports"] }
crossbeam-channel = "0.5.15"
ctrlc = { version = "3.5", features = ["termination"] }
cry-chunk = { version = "0.1.0", path = "crates/formats/legacy/cry/cry-chunk" }
cry-character-assets = { path = "crates/import/legacy/cry/cry-character" }
