# Pinned to openssl 0.10's internal `foreign-types` major. The `Ssl`/`X509`
# wrappers in `openssl` impl `foreign_types::ForeignType` from the version
# they pull in transitively; mismatching here would mean our
# `ForeignType::as_ptr` calls in `secure_connection.rs` don't resolve.
# Move in lockstep with `openssl`.
foreign-types = "0.3"
