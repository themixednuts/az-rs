spade = "2.15.1"
steam-locator = { path = "crates/integrations/steam/locator" }
# Proc macro dependencies
syn = { version = "2.0", features = ["extra-traits", "full"] }
tempfile = "3"
texture-atlas = { path = "crates/formats/legacy/lumberyard/texture-atlas" }
texture-atlas-assets = { path = "crates/import/legacy/lumberyard/texture-atlas-assets" }
thiserror = "2.0"
bstr = "1.12"
byteorder = "1.5"
full_moon = { version = "=2.2.0", default-features = false, features = ["lua54"] }
getrandom = "0.3.4"
heck = "0.5"
petgraph = "0.8"
stylua = { version = "=2.5.2", default-features = false, features = ["lua54"] }
tiff = "0.11"
# Tokio (minimal features for reqwest/hyper compatibility)
# Only include what's needed for hyper-rustls to work
# rt = runtime (required for hyper), rt-multi-thread = multi-threaded scheduler
# net = networking, io-util = IO utilities, sync = sync primitives
tokio = {
  version = "1.52",
  default-features = false,
  features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
  ]
}
tokio-util = { version = "0.7", features = ["compat"] }
toml = { version = "1.1", features = ["serde"] }
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = "0.3"
turso = { version = "=0.8.0-pre.2", default-features = false, features = [
  "pure-rust-crypto",
] }
# Turso's pre-release manifests use compatible ranges for internal crates even
# though their generated APIs must advance as one release set. Keep the facade
# and its internal packages on the same published pre-release so regenerating
# Cargo.lock cannot combine incompatible generations.
turso_core = "=0.8.0-pre.2"
turso_ext = "=0.8.0-pre.2"
turso_macros = "=0.8.0-pre.2"
turso_parser = "=0.8.0-pre.2"
turso_sdk_kit = "=0.8.0-pre.2"
turso_sdk_kit_macros = "=0.8.0-pre.2"
turso_sync_engine = "=0.8.0-pre.2"
turso_sync_sdk_kit = "=0.8.0-pre.2"
unicode-normalization = "0.1"
uuid = { version = "1.23", features = ["serde", "v4", "v7"] }
vk2dfd = "0.1.0"
weezl = "0.2"
wgpu = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
windows = "0.62"
libc = "0.2"
libloading = "0.8.9"
zeroize = { version = "1.8", features = ["derive"] }
zip = {
  version = "9.0.0-pre2",
  default-features = false,
  features = ["deflate"]
}

