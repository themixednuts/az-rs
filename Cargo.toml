[patch.crates-io]
# luajit-src's static MSVC batch build otherwise inherits cl.exe's /MT
# default, which conflicts with Rust's default dynamic CRT. Keep the vendored
# source aligned with the target's crt-static feature instead of suppressing
# the resulting linker warning.
luajit-src = { path = "vendor/luajit-src" }

# proc-macro-error2 2.0.1 re-exports a private proc_macro crate, which Rust is
# phasing into a hard error. Apply the compiler-recommended public declaration
# while the abandoned upstream crate remains in the transitive graph.
proc-macro-error2 = { path = "vendor/proc-macro-error2" }

# RON 0.12.2 classifies every numeric token by searching the entire remaining
# document for a range operator, making numeric-heavy documents quadratic.
# Pin the accepted upstream bounded-search fix until it reaches a release.
ron = { git = "https://github.com/ron-rs/ron.git", rev = "31529b8b8d8c44ebf6ef91975da6cb14ae76a505" }

# notify 8.2 silently removes a Windows ReadDirectoryChangesW watch when its
# queue overruns or the watched directory disappears. Emit the same typed
# rescan event used by the Unix/macOS backends before removing that watch so
# consumers can reconcile and re-arm instead of remaining silently stale.
notify = { path = "vendor/notify" }

# crates.io bevy-steamworks 0.16 is the newest release, but it depends on
# bevy_app/bevy_ecs 0.18. Keep the public crate API and move only the Bevy edge
# to 0.19 so Steam integration shares the engine ECS/resource/message traits.
bevy-steamworks = { path = "vendor/bevy-steamworks" }

# bevy_mod_scripting 0.19's published crates still depend on Bevy 0.18 even
# though the engine runtime is on Bevy 0.19. Vendor the active BMS stack and
# retarget only its Bevy/glam dependency edges so Lua integration shares the
# same ECS, asset, reflection, and math types as the engine.
bevy_mod_scripting = { path = "vendor/bevy_mod_scripting/bevy_mod_scripting" }
bevy_mod_scripting_asset = { path = "vendor/bevy_mod_scripting/bevy_mod_scripting_asset" }
bevy_mod_scripting_bindings = { path = "vendor/bevy_mod_scripting/bevy_mod_scripting_bindings" }
bevy_mod_scripting_bindings_domain = { path = "vendor/bevy_mod_scripting/bevy_mod_scripting_bindings_domain" }
bevy_mod_scripting_core = { path = "vendor/bevy_mod_scripting/bevy_mod_scripting_core" }
bevy_mod_scripting_derive = { path = "vendor/bevy_mod_scripting/bevy_mod_scripting_derive" }
bevy_mod_scripting_display = { path = "vendor/bevy_mod_scripting/bevy_mod_scripting_display" }
bevy_mod_scripting_functions = { path = "vendor/bevy_mod_scripting/bevy_mod_scripting_functions" }
bevy_mod_scripting_lua = { path = "vendor/bevy_mod_scripting/bevy_mod_scripting_lua" }
bevy_mod_scripting_script = { path = "vendor/bevy_mod_scripting/bevy_mod_scripting_script" }
bevy_system_reflection = { path = "vendor/bevy_mod_scripting/bevy_system_reflection" }

# Unify wgpu: bevy 0.19 wants crates.io `wgpu ^29.0.3`; redirect the whole wgpu
# family to the same Zed fork rev the GPUI stack uses so bevy and GPUI share ONE
# wgpu. bevy depends on `wgpu-types`/`wgpu-hal`/`wgpu-core` *directly*, so all of
# them must be patched, not just `wgpu`, or bevy_render sees two copies of types
# like `Extent3d`. Keep the Bevy and wgpu type graph on one revision.
wgpu = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-types = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-hal = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
wgpu-core = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
# bevy_render uses `naga` directly too; the fork ships its own, so patch it as
# well or bevy_render sees two `naga::Module` types.
naga = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }

# Zed's WGPU fork uses `windows = 0.62` in `wgpu-hal`; crates.io
# `gpu-allocator 0.28.0` still resolves D3D12 through `windows 0.54`,
# which makes the D3D12 COM interface types incompatible on Windows.
# Local copy of upstream commit 46539528 with the Windows dependency
# narrowed to the 0.62 line so D3D12 COM interface types match Zed WGPU.
gpu-allocator = { path = "vendor/gpu-allocator" }

[patch."https://github.com/longbridge/gpui-component"]
# Current Zed GPUI requires explicit flex grow/shrink factors. Keep the
# component stack on upstream main, with a local compatibility patch until
# Longbridge lands the same API update.
#
# Vendored snapshot provenance: cut from upstream `main` at (or within hours
# of) commit 1aab597cae95d631e099f77003f7c3a0c8d1d83a ("select, combobox:
# Use popover background for dropdown menus", 2026-07-20) — the git revs
# above pin that point. The vendored tree carries local edits on top of it:
# the flex grow/shrink compatibility patch plus a locally added per-language
# `tree-sitter-*` feature table in crates/ui/Cargo.toml. To rebase onto a
# newer upstream: diff vendor/gpui-component against upstream at that rev,
# re-apply those local edits onto the new base, move both `rev =` pins above,
# and re-run the editor test suite.
gpui-component = { path = "vendor/gpui-component/crates/ui" }
gpui-component-assets = { path = "vendor/gpui-component/crates/assets" }
gpui-component-macros = { path = "vendor/gpui-component/crates/macros" }

[patch."https://github.com/zed-industries/zed"]
# GPUI currently logs Win32 invalid-handle errors during normal HWND teardown.
# GPUI also carries the typed composition-hole scene primitive used by the
# Windows viewport compositor. Keep both crates pinned to the same Zed source
# revision and vendored together.
gpui = { path = "vendor/zed/crates/gpui" }
gpui_windows = { path = "vendor/zed/crates/gpui_windows" }

# Linux GPUI renders through gpui_wgpu. Keep it vendored with gpui so additions
# to the shared scene primitive enum remain exhaustive on every editor host.
gpui_wgpu = { path = "vendor/zed/crates/gpui_wgpu" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# CI builds should optimize for wall-clock compile time, not local runtime
# performance. The dev profile intentionally optimizes dependencies for the
# engine/editor locally, but that makes clean Windows lint/test jobs expensive.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0
debug = 0
