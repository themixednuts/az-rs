# Pin one published crates.io release across Azoth and downstream workspaces so
# their lockfiles cannot resolve incompatible Drizzle/Turso API generations.
# Downstream workspaces should use these exact versions.
drizzle = "=0.1.16"
drizzle-migrations = "=0.1.16"
drizzle-types = "=0.1.16"
encoding_rs = "0.8"
