[package]
license.workspace = true
repository.workspace = true
name = "az-gem-roads-and-rivers"
version = "0.1.0"
edition = "2024"
description = "Lumberyard RoadsAndRivers Gem runtime data as a Bevy plugin"


[lints]
workspace = true
[dependencies]
az-gem-contract = { workspace = true }
az-gem-lmbr-central = { path = "../lmbr-central" }
az-prefab = { workspace = true }
bevy = { workspace = true, features = ["default_app", "3d_bevy_render", "scene"] }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true }

[dev-dependencies]
azoth-roads-and-rivers-ids = { path = "ids" }
