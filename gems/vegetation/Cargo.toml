[package]
license.workspace = true
repository.workspace = true
name = "az-gem-vegetation"
version = "0.1.0"
edition = "2024"
description = "Lumberyard Vegetation Gem component data as a Bevy plugin"


[lints]
workspace = true
[dependencies]
az-gem-contract = { workspace = true }
az-asset = { path = "../../crates/az/asset" }
az-core = { path = "../../crates/az/core" }
az-derive = { workspace = true }
az-filesystem = { workspace = true }
az-gem-gradient-signal = { path = "../gradient-signal" }
az-gem-legacy-terrain = { path = "../legacy-terrain" }
az-gem-lmbr-central = { path = "../lmbr-central" }
az-prefab = { workspace = true }
bevy = { workspace = true, features = ["default_app", "3d_bevy_render", "scene"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
azoth-vegetation-ids = { path = "ids" }
