[manifest]
kind = "gem"
schema = "azoth.gem/v3"

[gem]
id = "azoth.lmbr-central"
name = "LmbrCentral"
version = "0.1.0"

[paths]
assets = "assets"
scripts = "scripts"

# The gem's AZ types and component lowerings travel with it wherever it is
# linked, `asset-worker` included: that is the role whose ObjectStream lowering
# reads them, and the force-linked anchor this stanza replaces made them visible
# there.
[[contributions]]
id = "package"
kind = "code"
package = "az-gem-lmbr-central"
roles = ["game", "p2p", "client", "server", "unified", "headless-server", "project-host", "asset-worker", "runtime-host"]

# Reflected prefab types are read by the two hosts that resolve prefab documents
# without a Bevy world: `project-host` through its type registry and
# `asset-worker` through AZSCENE analysis. `asset-processor` is deliberately
# absent — the AP host links no gem code.
[[contributions]]
id = "prefab-types"
kind = "builder"
package = "az-gem-lmbr-central"
roles = ["project-host", "asset-worker"]

# `lmbr-central-assets` reads and writes this gem's own formats, so it depends
# on `az-gem-lmbr-central` and no engine bundle can name it without the
# asset-processor host linking gem code. Its registration reaches a host through
# this gem instead, from a bundle crate that may name both.
[[contributions]]
id = "builders"
kind = "builder"
package = "az-gem-lmbr-central-builders"
roles = ["project-host", "asset-worker"]

[[dependencies]]
id = "azoth.audio-system"
version = "^0.1.0"
