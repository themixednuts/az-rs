[package]
license.workspace = true
repository.workspace = true
name = "az-gem-historical-input"
version = "0.1.0"
edition.workspace = true
description = "Fixed-tick historical input assets and ECS runtime"

[lints]
workspace = true

[dependencies]
az-asset = { workspace = true }
az-core = { workspace = true, features = ["bevy", "serde"] }
az-derive = { workspace = true }
az-framework = { path = "../../crates/az/framework", optional = true, default-features = false }
az-gem-contract = { workspace = true }
bevy = { workspace = true, features = ["bevy_asset", "default_app"] }
postcard = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
default = ["bevy", "runtime"]
bevy = ["az-core/bevy"]
runtime = ["dep:az-framework"]
