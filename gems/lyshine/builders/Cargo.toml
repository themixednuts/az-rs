[package]
license.workspace = true
repository.workspace = true
name = "az-gem-lyshine-builders"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "LyShine contribution bundle: the gem's canvas source family, product format and asset type"
publish = false

[lints]
workspace = true

# Exactly the crates the gem's builder role links, and no others: the format
# crate whose registration this bundle names, plus the contract it names it
# through. The gem crate arrives transitively — `lyshine-canvas` is the crate
# that depends on it, which is the whole reason this bundle exists.
[dependencies]
az-gem-contract = { workspace = true }
lyshine-canvas = { workspace = true }

[dev-dependencies]
azoth-lyshine-ids = { path = "../ids" }
