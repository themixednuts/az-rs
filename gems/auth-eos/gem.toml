[manifest]
kind = "gem"
schema = "azoth.gem/v3"

[gem]
id = "azoth.auth.eos"
name = "Epic Online Services Authentication Provider"
version = "0.1.0"

[gem.origin]
publisher = "Azoth"
license = "MIT OR Apache-2.0"

[[dependencies]]
id = "azoth.auth"
version = "^0.1.0"

[[dependencies]]
id = "azoth.eos"
version = "^0.1.0"

[[contributions]]
id = "provider"
kind = "code"
package = "az-gem-auth-eos"
roles = ["named-service"]

[capabilities.provider]
label = "EOS Provider"
description = "EOS Connect authentication provider composed over the Epic Online Services platform gem."
contributions = ["provider"]
