[manifest]
kind = "gem"
schema = "azoth.gem/v3"

[gem]
id = "azoth.auth.local"
name = "Local Authentication Provider"
version = "0.1.0"

[gem.origin]
publisher = "Azoth"
license = "MIT OR Apache-2.0"

[[dependencies]]
id = "azoth.auth"
version = "^0.1.0"

[[contributions]]
id = "provider"
kind = "code"
package = "az-gem-auth-local"
roles = ["named-service"]

[capabilities.provider]
label = "Local Provider"
description = "Local user/password authentication provider for development and tests."
contributions = ["provider"]
