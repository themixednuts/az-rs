[package]
license.workspace = true
repository.workspace = true
name = "az-gem-auth"
version = "0.1.0"
edition = "2024"
description = "Azoth provider-neutral authentication contract gem (azoth.auth)"

[lints]
workspace = true

[features]
default = []
# The reference host authority (session signing/validation, refresh, revoke)
# and the JSON/HTTP transport that serves the `AuthHost` trait pull the JWT +
# axum/tokio stack. Client-only consumers (game code using CredentialSource)
# omit it and stay dependency-light.
host = ["dep:jsonwebtoken", "dep:axum", "dep:tokio"]

[dependencies]
az-gem-contract = { workspace = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
