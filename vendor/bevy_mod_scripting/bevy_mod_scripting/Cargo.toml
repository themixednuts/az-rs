[lib]
name = "bevy_mod_scripting"
path = "src/lib.rs"
bench = false

[[example]]
name = "docgen"
path = "examples/docgen.rs"
required-features = ["lua_language_server_files"]

[[example]]
name = "game_of_life"
path = "examples/game_of_life.rs"
required-features = [
    "lua54",
    "rhai",
]

[[example]]
name = "runscript"
path = "examples/run_script.rs"

[[example]]
name = "script_loading"
path = "examples/script_loading.rs"

