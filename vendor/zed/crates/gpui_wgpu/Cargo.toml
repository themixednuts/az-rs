[package]
name = "gpui_wgpu"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_wgpu.rs"

[features]
default = []
# Optional: only needed on platforms with multiple font sources (e.g. Linux).
font-kit = ["dep:font-kit"]

[dependencies]
# Zed-internal crates must come from the same git source as `gpui` so the
# `gpui`, `collections`, and `gpui_util` types line up with the rest of the
# vendored GPUI stack (see third_party/zed/crates/gpui_windows for the pattern).
gpui = { git = "https://github.com/zed-industries/zed", rev = "17c0ebb0f7b8b512d99f396e543e71c1775ff6f6", default-features = false }
collections = { git = "https://github.com/zed-industries/zed", rev = "17c0ebb0f7b8b512d99f396e543e71c1775ff6f6" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "17c0ebb0f7b8b512d99f396e543e71c1775ff6f6" }

# `wgpu` and `raw-window-handle` cross the gpui <-> gpui_wgpu type boundary, so
# they must resolve to the exact same source/version GPUI uses. The Zed wgpu
# fork is also pinned by our workspace, so Cargo unifies them to one rev.
wgpu = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
raw-window-handle = "0.6"

anyhow = "1.0"
bytemuck = "1"
cosmic-text = "0.19.0"
etagere = "0.2"
itertools = "0.14"
log = "0.4"
parking_lot = "0.12"
profiling = "1"
smallvec = "1.15"
swash = "0.2.6"
unicode-segmentation = "1"

# WARNING: If you change this, you must also publish a new version of
# zed-font-kit to crates.io.
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
