<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#1b1e23;}
</style>
</helmet>
<div data-htmlswap-component="toggle" data-htmlswap-tone="accent" onClick="{{ handleClick }}" style="{{ rowStyle }}" style-hover="{{ rowHover }}">
  <span data-htmlswap-slot="control" style="{{ trackStyle }}"><span style="{{ knobStyle }}"></span></span>
  <sc-if value="{{ hasText }}" hint-placeholder-val="{{ true }}">
    <div style="min-width:0;flex:1 1 auto;">
      <div style="display:flex;align-items:center;gap:7px;">
        <span style="font-size:12px;color:#d6dae0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ label }}</span>
        <sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}"><span style="font-size:9px;color:#7c838f;background:#23272e;padding:1px 5px;border-radius:3px;flex:0 0 auto;">REQUIRED</span></sc-if>
      </div>
      <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ false }}"><div style="font-size:10.5px;color:#6b7280;margin-top:2px;line-height:1.4;">{{ sublabel }}</div></sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:56},&quot;on&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;locked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Initialize Git repository&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;sublabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Adds a Rust + Aether .gitignore and first commit&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showLabel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3160a8&quot;,&quot;options&quot;:[&quot;#3160a8&quot;,&quot;#3a8f4e&quot;,&quot;#d6a23b&quot;,&quot;#b78fd6&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Style&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(on: boolean) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { on: undefined };

  renderVals() {
    const p = this.props;
    const controlled = typeof p.onChange === 'function';
    const seed = p.on != null ? !!p.on : !!p.default;
    const on = controlled ? seed : (this.state.on !== undefined ? this.state.on : seed);
    const locked = !!p.locked;
    const accent = p.accent || '#3160a8';
    const label = p.label ?? '';
    const sublabel = p.sublabel ?? '';
    const hasText = !!(label || sublabel) && p.showLabel !== false;

    const handleClick = () => {
      if (locked) return;
      const next = !on;
      if (!controlled) this.setState({ on: next });
      if (typeof p.onChange === 'function') p.onChange(next);
    };

    return {
      handleClick,
      locked,
      label, sublabel,
      hasText,
      hasSub: !!sublabel,
      rowStyle: {
        display: 'flex', alignItems: hasText ? 'flex-start' : 'center', gap: '11px',
        padding: hasText ? '2px 0' : '0',
        cursor: locked ? 'not-allowed' : 'default',
        userSelect: 'none', width: 'fit-content', maxWidth: '100%'
      },
      rowHover: '',
      trackStyle: {
        width: '30px', height: '17px', borderRadius: '9px', flex: '0 0 auto',
        background: on ? (locked ? '#2d5230' : accent) : '#3a3f48',
        position: 'relative', marginTop: hasText ? '1px' : '0',
        opacity: locked ? 0.85 : 1, transition: 'background .12s'
      },
      knobStyle: {
        position: 'absolute', top: '2px', left: '2px', width: '13px', height: '13px',
        borderRadius: '50%', background: on ? '#fff' : '#9aa1ac',
        transform: on ? 'translateX(13px)' : 'translateX(0)', transition: 'transform .12s'
      }
    };
  }
}
</script>
</body>
</html>
