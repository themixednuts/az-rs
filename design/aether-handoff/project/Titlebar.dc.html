<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#15171b;}
  .ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;display:inline-block;vertical-align:middle;-webkit-font-smoothing:antialiased;user-select:none;}
</style>
</helmet>
<div data-htmlswap-component="titlebar" data-htmlswap-region="app.window" style="height:36px;display:flex;align-items:center;background:#202429;border-bottom:1px solid #2c313a;padding:0 10px;font-family:'IBM Plex Sans',system-ui,sans-serif;user-select:none;">
  <div style="{{ markStyle }}"></div>
  <span style="font-size:12.5px;font-weight:600;color:#e4e7ec;letter-spacing:.2px;">{{ title }}</span>
  <sc-if value="{{ hasSubtitle }}" hint-placeholder-val="{{ true }}"><span style="font-size:12px;color:#6b7280;margin-left:7px;">{{ subtitle }}</span></sc-if>
  <div data-htmlswap-slot="window-controls" style="margin-left:auto;display:flex;align-items:center;gap:2px;">
    <div style="width:28px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:5px;color:#8b919c;cursor:default;" style-hover="background:#2c313a;"><span class="ms" style="font-size:15px;">remove</span></div>
    <div style="width:28px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:5px;color:#8b919c;cursor:default;" style-hover="background:#2c313a;"><span class="ms" style="font-size:13px;">crop_square</span></div>
    <div style="width:28px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:5px;color:#8b919c;cursor:default;" style-hover="background:#c0453f;color:#fff;"><span class="ms" style="font-size:16px;">close</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:36},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Aether&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Project Manager&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4188e0&quot;,&quot;options&quot;:[&quot;#4188e0&quot;,&quot;#3a8f4e&quot;,&quot;#d6a23b&quot;,&quot;#b78fd6&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Style&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const subtitle = p.subtitle ?? '';
    return {
      title: p.title ?? 'Aether',
      subtitle, hasSubtitle: !!subtitle,
      markStyle: {
        width: '14px', height: '14px', background: p.accent || '#4188e0',
        transform: 'rotate(45deg)', borderRadius: '2px', marginRight: '11px', flex: '0 0 auto'
      }
    };
  }
}
</script>
</body>
</html>
