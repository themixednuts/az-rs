<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#15171b;}
  .ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;display:inline-block;vertical-align:middle;-webkit-font-smoothing:antialiased;user-select:none;}
</style>
</helmet>
<a data-htmlswap-component="project-row" data-htmlswap-region="project.manager.recents" href="{{ href }}" style="{{ rowStyle }}" style-hover="background:#1b1e23;border-color:#2c313a;">
  <span style="width:40px;flex:0 0 40px;display:flex;justify-content:center;"><span style="{{ iconTileStyle }}"><span class="ms" style="font-size:18px;color:#fff;">{{ icon }}</span></span></span>
  <span style="flex:1 1 auto;min-width:0;">
    <span style="display:block;font-size:13px;font-weight:500;color:#e4e7ec;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'IBM Plex Sans',system-ui,sans-serif;">{{ name }}<sc-if value="{{ pinned }}" hint-placeholder-val="{{ false }}"><span class="ms" style="font-size:13px;color:#d6a23b;margin-left:6px;">push_pin</span></sc-if></span>
    <span style="display:block;font-size:10.5px;color:#6b7280;font-family:'IBM Plex Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ path }}</span>
  </span>
  <span style="width:150px;color:#9aa1ac;font-size:11.5px;font-family:'IBM Plex Sans',system-ui,sans-serif;">{{ kind }}</span>
  <span style="width:80px;color:#7c838f;font-size:11.5px;font-family:'IBM Plex Mono',monospace;">{{ gems }}</span>
  <span style="width:90px;"><span style="{{ verStyle }}">{{ ver }}</span></span>
  <span style="width:120px;color:#8b919c;font-size:11px;font-family:'IBM Plex Sans',system-ui,sans-serif;">{{ opened }}</span>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:56},&quot;project&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;name&quot;:&quot;RiftRunner&quot;,&quot;path&quot;:&quot;~/dev/aether/RiftRunner&quot;,&quot;kind&quot;:&quot;First Person&quot;,&quot;gems&quot;:12,&quot;ver&quot;:&quot;0.4.2&quot;,&quot;opened&quot;:&quot;2 hours ago&quot;,&quot;icon&quot;:&quot;sports_esports&quot;,&quot;accent&quot;:&quot;#4188e0&quot;,&quot;pinned&quot;:true},&quot;tsType&quot;:&quot;{ name:string; path:string; kind:string; gems:number; ver:string; opened:string; icon:string; accent:string; pinned:boolean }&quot;},&quot;latestVersion&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0.4.2&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Style&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Aether Editor.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const pr = this.props.project || {};
    const latest = this.props.latestVersion || '0.4.2';
    const ver = pr.ver ?? '0.4.2';
    const isLatest = ver === latest;
    return {
      href: this.props.href || 'Aether Editor.dc.html',
      icon: pr.icon ?? 'sports_esports',
      name: pr.name ?? 'RiftRunner',
      path: pr.path ?? '~/dev/aether/RiftRunner',
      kind: pr.kind ?? 'First Person',
      gems: (pr.gems != null ? pr.gems : 12) + ' gems',
      ver, opened: pr.opened ?? '2 hours ago', pinned: !!pr.pinned,
      iconTileStyle: { width: '30px', height: '30px', borderRadius: '7px', background: pr.accent || '#4188e0', display: 'flex', alignItems: 'center', justifyContent: 'center' },
      verStyle: { fontSize: '10px', fontFamily: "'IBM Plex Mono',monospace", color: isLatest ? '#57b97e' : '#8b919c', background: isLatest ? 'rgba(87,185,126,0.12)' : '#22262c', padding: '2px 7px', borderRadius: '4px' },
      rowStyle: { display: 'flex', alignItems: 'center', height: '52px', padding: '0 12px', borderRadius: '8px', border: '1px solid transparent', cursor: 'default', textDecoration: 'none', color: 'inherit' }
    };
  }
}
</script>
</body>
</html>
