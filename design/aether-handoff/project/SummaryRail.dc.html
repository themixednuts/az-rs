<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#181b20;}
  .ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;display:inline-block;vertical-align:middle;-webkit-font-smoothing:antialiased;user-select:none;}
  ::-webkit-scrollbar{width:11px;}
  ::-webkit-scrollbar-thumb{background:#39404b;border:3px solid transparent;background-clip:padding-box;border-radius:8px;}
</style>
</helmet>
<div data-htmlswap-component="summary-rail" data-htmlswap-slot="summary" style="width:300px;height:100%;background:#181b20;border-left:1px solid #2c313a;display:flex;flex-direction:column;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#d6dae0;user-select:none;">
  <div style="padding:18px 18px 14px;border-bottom:1px solid #20242a;">
    <div style="font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#5f6670;margin-bottom:11px;">Summary</div>
    <div style="display:flex;align-items:center;gap:11px;">
      <div style="width:44px;height:44px;border-radius:10px;background:#22262c;display:flex;align-items:center;justify-content:center;flex:0 0 auto;"><span class="ms" style="font-size:24px;color:{{ iconColor }};">{{ icon }}</span></div>
      <div style="min-width:0;"><div style="font-size:14px;font-weight:600;color:#e8ebef;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ name }}</div><div style="font-size:11px;color:#8b919c;">{{ templateName }} template</div></div>
    </div>
  </div>
  <div style="flex:1 1 auto;overflow-y:auto;padding:14px 18px;">
    <div style="font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#5f6670;margin-bottom:9px;">Configuration</div>
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
      <div style="display:flex;align-items:center;justify-content:space-between;min-height:24px;padding:3px 0;border-bottom:1px solid #1c1f24;"><span style="font-size:11px;color:#7c838f;">{{ r.label }}</span><span style="font-size:11px;color:#c2c8d0;font-family:'IBM Plex Mono',monospace;max-width:160px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ r.value }}</span></div>
    </sc-for>
    <div style="font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#5f6670;margin:16px 0 9px;display:flex;justify-content:space-between;"><span>Gems</span><span style="color:#7fb0ec;font-family:'IBM Plex Mono',monospace;">{{ gemCount }} enabled</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;">
      <sc-for list="{{ gems }}" as="g" hint-placeholder-count="6"><span style="display:flex;align-items:center;gap:4px;font-size:10.5px;color:#aeb4bd;background:#22262c;border:1px solid #2c313a;padding:3px 8px;border-radius:5px;"><span class="ms" style="font-size:12px;color:{{ g.color }};">{{ g.icon }}</span>{{ g.name }}</span></sc-for>
    </div>
  </div>
  <div style="flex:0 0 auto;padding:14px 18px;border-top:1px solid #20242a;">
    <a href="{{ createHref }}" style="display:flex;align-items:center;justify-content:center;gap:8px;height:40px;background:#2f6ad0;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:default;text-decoration:none;" style-hover="filter:brightness(1.1);"><span class="ms" style="font-size:19px;">rocket_launch</span>Create Project</a>
    <div onClick="{{ onCancel }}" style="text-align:center;margin-top:9px;font-size:11px;color:#7c838f;cursor:default;" style-hover="color:#d6dae0;">Cancel</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:560},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;MyGame&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;templateName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;3D&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;view_in_ar&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;iconColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4188e0&quot;,&quot;options&quot;:[&quot;#4188e0&quot;,&quot;#3a8f4e&quot;,&quot;#d6a23b&quot;,&quot;#b78fd6&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Style&quot;},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[{&quot;label&quot;:&quot;Renderer&quot;,&quot;value&quot;:&quot;Vulkan&quot;},{&quot;label&quot;:&quot;Pipeline&quot;,&quot;value&quot;:&quot;Forward+&quot;},{&quot;label&quot;:&quot;Color Space&quot;,&quot;value&quot;:&quot;Linear&quot;},{&quot;label&quot;:&quot;Platforms&quot;,&quot;value&quot;:&quot;Windows, Linux, macOS&quot;},{&quot;label&quot;:&quot;Version Control&quot;,&quot;value&quot;:&quot;Git&quot;}],&quot;tsType&quot;:&quot;{ label:string; value:string }[]&quot;},&quot;gems&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[{&quot;name&quot;:&quot;Core Framework&quot;,&quot;icon&quot;:&quot;memory&quot;,&quot;color&quot;:&quot;#7a8aa0&quot;},{&quot;name&quot;:&quot;Atom Renderer&quot;,&quot;icon&quot;:&quot;palette&quot;,&quot;color&quot;:&quot;#4188e0&quot;},{&quot;name&quot;:&quot;PhysX 5&quot;,&quot;icon&quot;:&quot;fitness_center&quot;,&quot;color&quot;:&quot;#d6a23b&quot;}],&quot;tsType&quot;:&quot;{ name:string; icon:string; color:string }[]&quot;},&quot;gemCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;createHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Aether Editor.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;onCancel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const rows = Array.isArray(p.rows) ? p.rows.map((r, i) => ({ key: r.key ?? i, label: r.label, value: r.value })) : [];
    const gems = Array.isArray(p.gems) ? p.gems.map((g, i) => ({ key: g.key ?? i, name: g.name, icon: g.icon ?? 'extension', color: g.color ?? '#9aa1ac' })) : [];
    return {
      name: p.name ?? 'MyGame',
      icon: p.icon ?? 'view_in_ar',
      iconColor: p.iconColor ?? '#4188e0',
      templateName: p.templateName ?? '3D',
      rows, gems, gemCount: String(p.gemCount ?? gems.length),
      createHref: p.createHref ?? 'Aether Editor.dc.html',
      onCancel: typeof p.onCancel === 'function' ? p.onCancel : () => {}
    };
  }
}
</script>
</body>
</html>
