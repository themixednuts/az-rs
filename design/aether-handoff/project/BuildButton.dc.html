<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#1c2025;}
  .ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;display:inline-block;vertical-align:middle;-webkit-font-smoothing:antialiased;user-select:none;}
</style>
</helmet>
<div data-htmlswap-component="build-button" style="position:relative;width:fit-content;font-family:'IBM Plex Sans',system-ui,sans-serif;">
  <div data-htmlswap-tone="accent" data-htmlswap-variant="solid" onClick="{{ onToggle }}" style="display:flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:6px;background:#2f6ad0;color:#fff;font-size:11.5px;font-weight:500;cursor:default;" style-hover="filter:brightness(1.1);"><span class="ms" style="font-size:17px;">build</span>Build<span style="opacity:.7;font-weight:400;">· {{ configShort }}</span><span class="ms" style="font-size:16px;opacity:.8;">arrow_drop_down</span></div>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:33px;right:0;width:280px;background:#23272e;border:1px solid #363c46;border-radius:8px;box-shadow:0 14px 36px rgba(0,0,0,0.55);padding:6px;z-index:90;">
      <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:#5f6670;padding:5px 8px 4px;">Configuration</div>
      <sc-for list="{{ configs }}" as="c" hint-placeholder-count="4">
        <div onClick="{{ c.onClick }}" style="{{ c.style }}" style-hover="background:#2a2f37;">
          <span style="{{ c.dotStyle }}"></span>
          <span style="flex:1 1 auto;min-width:0;"><span style="display:block;font-size:11.5px;color:#e4e7ec;font-weight:500;">{{ c.name }}</span><span style="display:block;font-size:10px;color:#7c838f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ c.desc }}</span></span>
          <sc-if value="{{ c.selected }}" hint-placeholder-val="{{ false }}"><span class="ms" style="font-size:16px;color:#4188e0;flex:0 0 auto;">check</span></sc-if>
        </div>
      </sc-for>
      <div style="height:1px;background:#363c46;margin:5px 6px;"></div>
      <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:#5f6670;padding:3px 8px 4px;">Target Platform</div>
      <sc-for list="{{ targets }}" as="t" hint-placeholder-count="5">
        <div onClick="{{ t.onClick }}" style="{{ t.style }}" style-hover="background:#2a2f37;">
          <span class="ms" style="font-size:15px;color:#8b919c;flex:0 0 auto;width:18px;">{{ t.icon }}</span>
          <span style="flex:1 1 auto;font-size:11.5px;color:#cfd4db;">{{ t.name }}</span>
          <sc-if value="{{ t.selected }}" hint-placeholder-val="{{ false }}"><span class="ms" style="font-size:16px;color:#4188e0;flex:0 0 auto;">check</span></sc-if>
        </div>
      </sc-for>
      <div style="height:1px;background:#363c46;margin:5px 6px;"></div>
      <sc-for list="{{ actions }}" as="a" hint-placeholder-count="6">
        <div onClick="{{ a.onClick }}" style="{{ a.style }}" style-hover="background:#3160a8;color:#fff;">
          <span style="display:flex;align-items:center;gap:9px;"><span class="ms" style="font-size:16px;color:{{ a.iconColor }};width:16px;">{{ a.icon }}</span>{{ a.label }}</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6b7280;">{{ a.shortcut }}</span>
        </div>
      </sc-for>
    </div>
    <div onClick="{{ onClose }}" style="position:fixed;inset:0;z-index:85;"></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:420},&quot;config&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Debug&quot;,&quot;Development&quot;,&quot;Profile&quot;,&quot;Shipping&quot;],&quot;default&quot;:&quot;Development&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;State&quot;},&quot;target&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Windows&quot;,&quot;Linux&quot;,&quot;macOS&quot;,&quot;Android&quot;,&quot;Web&quot;],&quot;default&quot;:&quot;Windows&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;State&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;configShort&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dev&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;onToggle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onConfig&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(name: string) =&gt; void&quot;},&quot;onTarget&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(name: string) =&gt; void&quot;},&quot;onAction&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(label: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { open: undefined, cfg: undefined, tgt: undefined };
  defaultConfigs() {
    return [
      ['Debug', 'Unoptimized · full symbols', '#cf6a64'],
      ['Development', 'Optimized · editor tooling', '#d6a23b'],
      ['Profile', 'Optimized · profiler hooks', '#5ac0c0'],
      ['Shipping', 'Fully optimized · no debug', '#3a8f4e']
    ];
  }
  defaultTargets() {
    return [['Windows', 'desktop_windows'], ['Linux', 'dns'], ['macOS', 'laptop_mac'], ['Android', 'android'], ['Web', 'language']];
  }
  defaultActions() {
    return [['Build', 'build', 'Ctrl+B', '#8fc97e'], ['Build & Run', 'play_circle', 'Ctrl+Shift+B', '#7fb0ec'], ['Clean', 'cleaning_services', '', '#d6a23b'], ['Build Settings…', 'tune', '', '#9aa1ac']];
  }
  renderVals() {
    const p = this.props;
    const controlled = typeof p.onToggle === 'function';
    const open = controlled ? !!p.open : (this.state.open !== undefined ? this.state.open : !!p.open);
    const cfg = this.state.cfg !== undefined ? this.state.cfg : (p.config || 'Development');
    const tgt = this.state.tgt !== undefined ? this.state.tgt : (p.target || 'Windows');
    const configShort = (controlled && p.configShort) ? p.configShort : cfg.slice(0, 3);

    const cfgRow = (name, desc, dot) => ({ key: name, name, desc, selected: name === cfg,
      onClick: () => { this.setState({ cfg: name }); if (typeof p.onConfig === 'function') p.onConfig(name); },
      style: { display: 'flex', alignItems: 'center', gap: '9px', padding: '5px 8px', borderRadius: '6px', cursor: 'default' },
      dotStyle: { width: '7px', height: '7px', borderRadius: '50%', background: dot, flex: '0 0 auto' } });
    const tgtRow = (name, icon) => ({ key: name, name, icon, selected: name === tgt,
      onClick: () => { this.setState({ tgt: name }); if (typeof p.onTarget === 'function') p.onTarget(name); },
      style: { display: 'flex', alignItems: 'center', gap: '8px', height: '28px', padding: '0 8px', borderRadius: '6px', cursor: 'default' } });
    const actRow = (label, icon, shortcut, iconColor) => ({ key: label, label, icon, shortcut, iconColor,
      onClick: () => { if (typeof p.onAction === 'function') p.onAction(label); if (!controlled) this.setState({ open: false }); },
      style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: '28px', padding: '0 8px', borderRadius: '6px', cursor: 'default', color: '#cfd4db', fontSize: '11.5px' } });

    const cfgs = Array.isArray(p.configs) ? p.configs : this.defaultConfigs().map(c => cfgRow(c[0], c[1], c[2]));
    const configs = Array.isArray(p.configs) ? p.configs : cfgs;
    return {
      configShort, open,
      onToggle: () => { if (!controlled) this.setState(s => ({ open: !(s.open !== undefined ? s.open : open) })); if (typeof p.onToggle === 'function') p.onToggle(); },
      onClose: () => { if (!controlled) this.setState({ open: false }); if (typeof p.onClose === 'function') p.onClose(); },
      configs: Array.isArray(p.configs) ? p.configs : this.defaultConfigs().map(c => cfgRow(c[0], c[1], c[2])),
      targets: Array.isArray(p.targets) ? p.targets : this.defaultTargets().map(t => tgtRow(t[0], t[1])),
      actions: Array.isArray(p.actions) ? p.actions : this.defaultActions().map(a => actRow(a[0], a[1], a[2], a[3]))
    };
  }
}
</script>
</body>
</html>
