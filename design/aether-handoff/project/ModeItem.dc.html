<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#181b20;}
  .ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;display:inline-block;vertical-align:middle;-webkit-font-smoothing:antialiased;user-select:none;}
</style>
</helmet>
<div data-htmlswap-component="mode-item" onClick="{{ handleClick }}" title="{{ title }}" style="{{ itemStyle }}" style-hover="color:#d6dae0;"><span class="ms" style="font-size:21px;">{{ icon }}</span></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:46,&quot;height&quot;:48},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;view_in_ar&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Scene&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const active = !!p.active;
    return {
      icon: p.icon ?? 'view_in_ar',
      title: p.title ?? 'Scene',
      handleClick: typeof p.onClick === 'function' ? p.onClick : () => {},
      itemStyle: {
        width: '34px', height: '34px', display: 'flex', alignItems: 'center', justifyContent: 'center',
        borderRadius: '7px', cursor: 'default',
        color: active ? '#fff' : '#7c838f',
        background: active ? '#2c313a' : 'transparent',
        boxShadow: active ? 'inset 2px 0 0 #4188e0' : 'none'
      }
    };
  }
}
</script>
</body>
</html>
