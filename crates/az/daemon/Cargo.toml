[package]
license.workspace = true
repository.workspace = true
name = "az-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "UI-free Azoth user daemon service core"


[lints]
workspace = true
[features]
default = []
test-support = []

[dependencies]
az-endpoint-discovery = { workspace = true }
az-filesystem = { workspace = true }
az-project = { path = "../project" }
az-observability = { path = "../observability" }
az-proto-core = { path = "../proto/core" }
az-proto-asset = { path = "../proto/asset" }
az-proto-daemon = { path = "../proto/daemon" }
az-proto-observability = { path = "../proto/observability" }
az-proto-runtime = { path = "../proto/runtime" }
az-proto-session = { path = "../proto/session" }
az-rpc = { workspace = true }
az-service-catalog = { workspace = true }
az-service-supervision = { workspace = true }
az-session = { path = "../session" }
az-work = { path = "../work", features = ["process"] }
capnp = { workspace = true }
capnp-rpc = { workspace = true }
clap = { workspace = true, features = ["derive"] }
crossbeam-channel = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[[bin]]
name = "azd"
path = "src/main.rs"

[dev-dependencies]
az-architecture-guard = { workspace = true }
az-session = { path = "../session", features = ["test-support"] }
tempfile = "3"
uuid = { workspace = true }
