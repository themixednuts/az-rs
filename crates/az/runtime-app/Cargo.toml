[package]
license.workspace = true
repository.workspace = true
name = "az-runtime-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Engine-owned Azoth runtime application lifecycle and Bevy app composition"

[features]
# Tools and dedicated servers retain the minimal Bevy application surface. A
# consumer that asks for a window must opt into the renderer/platform stack.
default = []
windowed = ["bevy/3d", "bevy/dds", "bevy/file_watcher"]
oodle = ["az-framework/oodle"]

[lints]
workspace = true
[dependencies]
az-asset = { workspace = true }
az-core = { workspace = true }
az-engine = { workspace = true }
az-filesystem = { workspace = true }
# Runtime hosts opt into proprietary package codecs through this crate's
# matching feature. The default graph mounts uncompressed packages and does not
# require a local SDK installation.
az-framework = { path = "../framework", default-features = false }
az-gem-contract = { workspace = true, features = ["app"] }
az-project = { workspace = true }
bevy = { workspace = true, features = ["default_app"] }
clap = { workspace = true, features = ["derive", "env"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `audit` matches a declared clock use to its placement by the scheduled
# system's name, and Bevy only carries names under its `debug` feature. A
# consumer that wants the assertion enables the same feature.
bevy = { workspace = true, features = ["debug"] }
tempfile = { workspace = true }
uuid = { workspace = true }
