[package]
license.workspace = true
repository.workspace = true
name = "az-sessiond"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Azoth per-worktree session supervisor daemon"


[lints]
workspace = true
[dependencies]
az-endpoint-discovery = { path = "../endpoint-discovery" }
az-filesystem = { path = "../filesystem" }
az-observability = { path = "../observability" }
az-proto-core = { path = "../proto/core" }
az-proto-daemon = { path = "../proto/daemon" }
az-proto-session = { path = "../proto/session" }
az-rpc = { path = "../rpc" }
az-session = { path = "../session" }
az-service-supervision = { workspace = true }
capnp = { workspace = true }
clap = { workspace = true, features = ["derive"] }
crossbeam-channel = { workspace = true }
signal-hook = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
az-architecture-guard = { workspace = true }
az-daemon = { path = "../daemon", features = ["test-support"] }
az-project = { path = "../project" }
tempfile = "3"
toml = { workspace = true }
