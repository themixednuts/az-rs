[package]
license.workspace = true
repository.workspace = true
name = "az-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Reusable authored render component schemas for Azoth"

[lints]
workspace = true

[features]
default = []
bevy = [
    "dep:bevy",
    "az-core/bevy",
    "dep:az-material",
    "dep:az-material-builder",
    "az-material-builder/bevy",
    "dep:az-mesh-builder",
    "az-mesh-builder/bevy",
    "dep:tracing",
]

[dependencies]
az-core = { workspace = true, features = ["serde"] }
az-material = { workspace = true, optional = true }
az-material-builder = { workspace = true, optional = true }
az-mesh-builder = { workspace = true, optional = true }
az-prefab = { workspace = true }
az-transform = { workspace = true }
bevy = { workspace = true, features = ["3d", "experimental_pbr_pcss"], optional = true }
bevy_ecs = { workspace = true }
bevy_reflect = { workspace = true }
glam = { workspace = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true }
