[package]
license.workspace = true
repository.workspace = true
name = "az-node-graph"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Azoth visual graph document, node catalog, and command model"


[lints]
workspace = true
[dependencies]
az-core = { workspace = true, features = ["serde"] }
# Registrar-only: this crate names registry entry types, never a Bevy `App`.
# `default-features = false` drops the contract's `app` feature, which is what
# keeps az-node-graph's dependency graph Bevy-free.
az-gem-contract = { workspace = true }
blake3 = { workspace = true }
ron = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
az-architecture-guard = { workspace = true }
toml = { workspace = true }
