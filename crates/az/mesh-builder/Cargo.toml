[package]
license.workspace = true
repository.workspace = true
name = "az-mesh-builder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Azoth native glTF mesh builder and processed mesh product"

[lints]
workspace = true

[features]
default = []
bevy = ["dep:bevy"]

[dependencies]
az-asset-builder = { workspace = true }
az-core = { workspace = true }
az-gem-contract = { workspace = true }
az-material-builder = { workspace = true }
az-mesh = { workspace = true }
base64 = { workspace = true }
bevy = { workspace = true, features = ["bevy_asset", "bevy_mesh"], optional = true }
gltf = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
az-build-fingerprint = { workspace = true }
