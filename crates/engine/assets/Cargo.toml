[package]
license.workspace = true
repository.workspace = true
name = "az-engine-assets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Engine contribution bundle: the asset types every runtime and asset-pipeline role composes"
publish = false

[lints]
workspace = true

# The engine crates the `assets` role set links. Narrower than `types` by two
# roles — a `tool` and a `named-service` target name no assets — and wider
# than `builders`, because a runtime resolves the same asset types the
# pipeline produces.
[dependencies]
# az-animation is here for its asset types and product formats only; its source
# schemas and build rules stay in `builders`. The crate is one crate, so this
# bundle links it — which costs the runtime roles nothing they did not already
# link, and is why the split is by surface here rather than by crate.
az-animation = { workspace = true }
az-core = { workspace = true }
az-gem-contract = { workspace = true }
az-mesh = { workspace = true }
az-scene = { workspace = true }
az-terrain-runtime = { workspace = true }
